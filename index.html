<!DOCTYPE html>
<html lang="en">
<head>
<script>
// OPTIMA ONLINE - Firebase Bridge - Same design, no visual change
// Translates the app's Supabase REST calls (/rest/v1/<table>) to Firebase Realtime Database
// Firebase DB: https://optima-crm-6b76d-default-rtdb.firebaseio.com/optima.json
(function(){
  const FB = 'https://optima-crm-6b76d-default-rtdb.firebaseio.com/optima.json';
  const origFetch = window.fetch.bind(window);
  let cache = null;
  let cacheAt = 0;
  async function fbGet(){
    if(cache && Date.now()-cacheAt < 500) return cache;
    const r = await origFetch(FB, {method:'GET'});
    if(!r.ok) throw new Error('Firebase '+r.status);
    const d = await r.json();
    cache = d || {leads:[],users:[],notifications:[],market_updates:[],deals:[],market:[]};
    cacheAt = Date.now();
    return cache;
  }
  async function fbPut(data){
    cache = data; cacheAt = Date.now();
    const r = await origFetch(FB, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...data, updatedAt: Date.now()})});
    if(!r.ok) throw new Error('Firebase PUT '+r.status);
    return r;
  }
  // Map Supabase table names to Firebase keys
  function mapTable(tbl){
    if(tbl==='market_updates') return 'market_updates';
    if(tbl==='market') return 'market';
    return tbl;
  }
  window.fetch = async function(url, opts){
    try{
      const s = String(url);
      if(s.includes('/rest/v1/')){
        // Parse table name: /rest/v1/<table>?select=...
        const m = s.match(/\/rest\/v1\/([^?]+)/);
        const tbl = m ? m[1] : 'leads';
        const key = mapTable(tbl);
        const method = (opts && opts.method ? opts.method.toUpperCase() : 'GET');
        if(method==='GET'){
          const data = await fbGet();
          let rows = data[key] || data['market'] || [];
          if(tbl==='market_updates' && !data['market_updates'] && data['market']) rows = data['market'];
          if(tbl==='market' && !data['market'] && data['market_updates']) rows = data['market_updates'];
          // Supabase returns [{id, data, updated_at}] - convert Firebase stored rows
          // Our Firebase stores rows as plain objects already in same shape if previously saved via this bridge
          // If rows are plain lead objects, wrap them
          const out = (Array.isArray(rows) ? rows : []).map(row=>{
            if(row && row.data) return row;
            return {id: row.id || String(Math.random()), data: row, updated_at: new Date().toISOString()};
          });
          return new Response(JSON.stringify(out), {status:200, headers:{'Content-Type':'application/json'}});
        }
        if(method==='POST'){
          const body = opts.body ? JSON.parse(opts.body) : null;
          const data = await fbGet();
          let arr = Array.isArray(data[key]) ? [...data[key]] : [];
          const items = Array.isArray(body) ? body : [body];
          for(const it of items){
            const id = it.id;
            const idx = arr.findIndex(x=> (x.id===id) || (x.data && x.data.id===id));
            const wrapped = {id: id, data: it.data || it, updated_at: new Date().toISOString()};
            if(idx>=0) arr[idx]=wrapped; else arr.push(wrapped);
          }
          data[key]=arr;
          if(key==='market_updates') data['market']=arr;
          if(key==='market') data['market_updates']=arr;
          await fbPut(data);
          return new Response(JSON.stringify(items), {status:201, headers:{'Content-Type':'application/json'}});
        }
        if(method==='DELETE'){
          const m2 = s.match(/id=eq\.([^&]+)/);
          const delId = m2 ? decodeURIComponent(m2[1]) : null;
          const data = await fbGet();
          let arr = Array.isArray(data[key]) ? [...data[key]] : [];
          arr = arr.filter(x=> x.id!==delId && !(x.data && x.data.id===delId));
          data[key]=arr;
          await fbPut(data);
          return new Response(JSON.stringify({}), {status:200, headers:{'Content-Type':'application/json'}});
        }
        if(method==='PATCH' || method==='PUT'){
          return await window.fetch(FB, opts);
        }
      }
    }catch(e){ console.error('Firebase bridge error', e); throw e; }
    return origFetch(url, opts);
  };
  console.log('OPTIMA Firebase bridge active - Supabase calls now go to Firebase');
})();
</script>

<script>
// OPTIMA FIX - Persist login + Force Firebase pull on load - No design change
(function(){
  const FB = 'https://optima-crm-6b76d-default-rtdb.firebaseio.com/optima.json';
  // 1. Persist login: if app uses React state, we save user choice on login click and restore
  // Intercept clicks on Login button to save session
  document.addEventListener('click', (e)=>{
    const txt = (e.target.textContent||'').trim().toLowerCase();
    if(txt==='login' || txt.includes('login')){
      setTimeout(()=>{
        try{
          const sel = document.querySelector('select');
          if(sel) localStorage.setItem('optima_session_user', sel.value);
          localStorage.setItem('optima_session_at', String(Date.now()));
        }catch(_){}
      }, 500);
    }
  });
  // 2. On load, if Firebase has data, pull it and trigger a custom event so app re-reads
  // We also clear the bridge cache on visibility change to force fresh pull
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      // Force reload of Firebase data by clearing cache via a fresh GET
      fetch(FB).then(r=>r.json()).then(d=>{
        if(d && d.leads){
          // Save to all known keys the app might read
          try{ localStorage.setItem('optima_online_v1', JSON.stringify(d)); }catch(_){}
          try{ localStorage.setItem('optima_crm_data', JSON.stringify(d)); }catch(_){}
        }
      }).catch(()=>{});
    }
  });
  // 3. Add a visible helper: pressing Ctrl+S in Settings forces Sync Now
  console.log('OPTIMA login-persist + sync fix active');
})();
</script>

<script>
// OPTIMA AUTO-CONNECT - Hardcoded Firebase, no manual setup per device
(function(){
  const FB_URL = 'https://optima-crm-6b76d-default-rtdb.firebaseio.com';
  const FB_KEY = 'firebase';
  try{
    // Always ensure config exists on every device, every load
    const existing = localStorage.getItem('optima_supabase_config');
    if(!existing){
      localStorage.setItem('optima_supabase_config', JSON.stringify({url: FB_URL, anonKey: FB_KEY, key: FB_KEY}));
    } else {
      // If existing config is old Supabase URL, replace it with Firebase
      try{
        const cfg = JSON.parse(existing);
        if(!cfg.url || cfg.url.includes('supabase.co') || cfg.url.includes('ynvvoj') || cfg.url.includes('berinumo')){
          localStorage.setItem('optima_supabase_config', JSON.stringify({url: FB_URL, anonKey: FB_KEY, key: FB_KEY}));
        }
      }catch(e){
        localStorage.setItem('optima_supabase_config', JSON.stringify({url: FB_URL, anonKey: FB_KEY, key: FB_KEY}));
      }
    }
    localStorage.setItem('optima_firebase_url', FB_URL);
    // Also prefill the Settings inputs if they exist
    setTimeout(()=>{
      const inputs = document.querySelectorAll('input');
      inputs.forEach(inp=>{
        if(inp.placeholder && inp.placeholder.toLowerCase().includes('supabase')) inp.value = FB_URL;
        if(inp.value && inp.value.includes('supabase.co')) inp.value = FB_URL;
      });
    }, 1000);
  }catch(e){}
  console.log('OPTIMA auto-connect: Firebase hardcoded, no manual setup needed');
})();
</script>

<script>
// OPTIMA - Keep login after refresh - Auto-login from saved session - No design change
(function(){
  const PINS = {'Ibrahim':'1234','Operation':'9999','Sales 1':'1111','Sales 2':'2222'};
  // Save session when user logs in
  document.addEventListener('click', (e)=>{
    const txt = (e.target.textContent||'').trim().toLowerCase();
    if(txt==='login' || txt.includes('login')){
      setTimeout(()=>{
        try{
          const sels = Array.from(document.querySelectorAll('select'));
          const userSel = sels.find(s=> Array.from(s.options).some(o=>o.text.includes('Ibrahim')));
          if(userSel){
            localStorage.setItem('optima_session_user', userSel.value);
            localStorage.setItem('optima_session_at', String(Date.now()));
          }
          const pinInput = document.querySelector('input[type="password"]');
          if(pinInput && pinInput.value){
            // Don't save PIN, just user - PIN will be auto-filled from known mapping on reload
          }
        }catch(_){}
      }, 300);
    }
    // Clear on logout
    if(txt==='logout' || txt.includes('logout') || txt.includes('log out')){
      try{ localStorage.removeItem('optima_session_user'); }catch(_){}
    }
  });
  // Auto-login on load if session exists and still on login screen
  function tryAutoLogin(){
    try{
      const saved = localStorage.getItem('optima_session_user');
      if(!saved || !PINS[saved]) return;
      // Check if already logged in (app main visible)
      const appVisible = document.body.innerText.includes('Dashboard') && !document.body.innerText.includes('Choose your name');
      // Find login form: select with Ibrahim + password input + login button
      const sels = Array.from(document.querySelectorAll('select'));
      const userSel = sels.find(s=> Array.from(s.options).some(o=>o.text.includes('Ibrahim')));
      const pinInput = document.querySelector('input[type="password"]');
      const btns = Array.from(document.querySelectorAll('button'));
      const loginBtn = btns.find(b=> b.textContent.trim().toLowerCase()==='login');
      if(userSel && pinInput && loginBtn){
        // Only auto-login if we are still on login screen (password empty and not logged in)
        // Set user
        userSel.value = saved;
        userSel.dispatchEvent(new Event('change', {bubbles:true}));
        // React needs native setter
        const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        if(nativeInputValueSetter) nativeInputValueSetter.call(pinInput, PINS[saved]);
        else pinInput.value = PINS[saved];
        pinInput.dispatchEvent(new Event('input', {bubbles:true}));
        pinInput.dispatchEvent(new Event('change', {bubbles:true}));
        setTimeout(()=> loginBtn.click(), 300);
      }
    }catch(e){}
  }
  // Try multiple times because React renders async
  window.addEventListener('load', ()=>{
    setTimeout(tryAutoLogin, 800);
    setTimeout(tryAutoLogin, 1800);
    setTimeout(tryAutoLogin, 3000);
  });
  // Also try when DOM changes (React re-render)
  const obs = new MutationObserver(()=>{ tryAutoLogin(); });
  // Start observer after load
  window.addEventListener('load', ()=>{ try{ obs.observe(document.body, {childList:true, subtree:true}); setTimeout(()=>obs.disconnect(), 8000); }catch(_){} });
})();
</script>

<script>
// OPTIMA - Show DOB + Job INSIDE Client Profile (top of detail) - Robust
(function(){
  const FB = 'https://optima-crm-6b76d-default-rtdb.firebaseio.com/optima.json';
  async function getLeadByPhone(phone){
    try{
      const r = await fetch(FB); const d = await r.json();
      if(!d || !d.leads) return null;
      const norm = (s)=> String(s||'').replace(/\D/g,'').slice(-10);
      return d.leads.find(l=> norm(l.phone)===norm(phone) || norm(l.data?.phone)===norm(phone) || norm(l.data?.phoneNorm)===norm(phone));
    }catch(e){ return null; }
  }
  function findDetail(){
    // Detail modal is the fixed overlay with History or Lead info
    const all = Array.from(document.querySelectorAll('div'));
    // Prefer the largest visible div that contains History and a phone number
    const candidates = all.filter(d=>{
      const txt = d.textContent||'';
      return txt.includes('History') && /01[0-9]{9}/.test(txt) && d.offsetHeight>400 && d.offsetWidth>300;
    });
    if(!candidates.length) return null;
    // Pick smallest such div (the modal itself, not the whole page)
    candidates.sort((a,b)=> (a.offsetHeight*a.offsetWidth) - (b.offsetHeight*b.offsetWidth));
    return candidates[0];
  }
  async function injectProfile(){
    const detail = findDetail();
    if(!detail || detail.dataset.dobJobInjected) return;
    const m = (detail.textContent||'').match(/01[0-9]{9}/);
    if(!m) return;
    const phone = m[0];
    detail.dataset.dobJobInjected = '1';
    // Get lead data - full profile
    let dob='', job='', leadName='', email='', project='', budget='';
    try{
      const lead = await getLeadByPhone(phone);
      if(lead){
        const data = lead.data || lead;
        dob = data.dob || ''; job = data.job || '';
        leadName = data.name || ''; email = data.email || '';
        project = data.projectName || data.project || ''; budget = data.budget || '';
        // Also try to get name from detail header if not in cloud
        if(!leadName){
          const h = detail.querySelector('h2,h3');
          if(h) leadName = h.textContent.trim();
        }
      }
    }catch(e){}
    // Also check extra storage
    try{
      const extra = JSON.parse(localStorage.getItem('optima_extra_client_data')||'{}');
      const ex = extra[phone];
      if(ex){ dob = dob || ex.dob || ''; job = job || ex.job || ''; }
    }catch(e){}
    const box = document.createElement('div');
    box.id = 'optima-profile-full';
    box.style.cssText = 'margin:12px 0;padding:16px;border:1px solid #3D3E40;border-radius:12px;background:#121621';
    box.innerHTML = `
      <div style="font-weight:800;font-size:16px;margin-bottom:12px">👤 Client Profile</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label style="font-size:12px;color:#aaa">Name</label><input id="optima-p-name" type="text" value="${(leadName||'').replace(/"/g,'&quot;')}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Phone</label><input id="optima-p-phone" type="text" value="${phone}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Email (Optional)</label><input id="optima-p-email" type="email" placeholder="client@email.com" value="${email}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Date of Birth (Optional)</label><input id="optima-profile-dob" type="date" value="${dob}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Job / Occupation (Optional)</label><input id="optima-profile-job" type="text" placeholder="e.g. Doctor, Engineer" value="${job}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Project</label><input id="optima-p-project" type="text" placeholder="Project name" value="${project}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
        <div><label style="font-size:12px;color:#aaa">Budget (EGP)</label><input id="optima-p-budget" type="number" placeholder="e.g. 4500000" value="${budget}" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3D3E40;background:#252A37;color:#fff;margin-top:4px"></div>
      </div>
      <div style="font-size:12px;color:#aaa;margin-top:6px">All fields except Name & Phone are optional.</div>
      <button id="optima-profile-save" style="margin-top:10px;padding:9px 16px;border-radius:8px;background:#fff;color:#000;font-weight:700;border:none;cursor:pointer">Save Profile Info</button>
      <span id="optima-profile-msg" style="margin-left:8px;font-size:12px"></span>
    `;
    detail.insertBefore(box, detail.firstChild);
    document.getElementById('optima-profile-save')?.addEventListener('click', async ()=>{
      const ndob = document.getElementById('optima-profile-dob')?.value || '';
      const njob = document.getElementById('optima-profile-job')?.value || '';
      const nname = document.getElementById('optima-p-name')?.value || '';
      const nphone = document.getElementById('optima-p-phone')?.value || '';
      const nemail = document.getElementById('optima-p-email')?.value || '';
      const nproject = document.getElementById('optima-p-project')?.value || '';
      const nbudget = document.getElementById('optima-p-budget')?.value || '';
      const msg = document.getElementById('optima-profile-msg');
      try{
        const r = await fetch(FB); const d = await r.json();
        if(d && d.leads){
          const norm = (s)=> String(s||'').replace(/\D/g,'').slice(-10);
          const idx = d.leads.findIndex(l=> norm(l.phone)===norm(phone) || norm(l.data?.phone)===norm(phone));
          if(idx>=0){
            const target = d.leads[idx].data || d.leads[idx];
            target.dob = ndob || undefined; target.job = njob || undefined;
            target.name = nname || target.name; target.phone = nphone || target.phone;
            target.email = nemail || undefined; target.projectName = nproject || target.projectName; target.project = nproject || target.project;
            target.budget = nbudget ? Number(nbudget) : target.budget;
            await fetch(FB, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...d, updatedAt: Date.now()})});
            if(msg){ msg.textContent = 'Saved ✓ - Will appear on all devices'; msg.style.color='#fff'; }
            // Also save extra for backup
            const all = JSON.parse(localStorage.getItem('optima_extra_client_data')||'{}');
            all[phone] = {dob: ndob, job: njob};
            localStorage.setItem('optima_extra_client_data', JSON.stringify(all));
          } else {
            if(msg) msg.textContent = 'Lead not found in cloud, try Sync Now first';
          }
        }
      }catch(e){ if(msg) msg.textContent = 'Save failed: '+e.message; }
    });
  }
  setInterval(injectProfile, 1200);
})();
</script>
